name: Runner probe

on:
  push:
    paths:
      - '.github/probe-trigger'

jobs:
  ping:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - run: echo "runner ok $(uname -a)" && sw_vers
